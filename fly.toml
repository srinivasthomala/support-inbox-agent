app = "brewline-support-agent"
primary_region = "iad"

[env]
  PORT = "8080"
  POLLER_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # The Gmail poller runs inside the app, so one machine must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"  # 256 MB OOMs once the Google API clients load
